<!DOCTYPE html><html><head><meta charset=utf-8><title>Command Palette ⌘K — Mobile</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Courier+Prime:wght@400;700&display=swap');
:root{--bg:#0b0c0f;--panel:#14161c;--hair:rgba(255,255,255,.08);--hair2:rgba(255,255,255,.14);--gold:#C6A463;--gold2:#E6D2A2;--goldink:#1a1509;--cream:#F4EEE0;--text:#E8E6E0;--mute:#9aa1ab;--faint:#6b727d;--blue:#5b8def;--green:#57b368;--amber:#e0a23b;--violet:#8b7cf0;--pink:#d6649a;--red:#e5635f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(900px 480px at 50% -10%,#15171d,#0b0c0f 60%);font-family:Inter,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;padding:40px;display:flex;flex-wrap:wrap;justify-content:center;gap:30px;min-height:100vh}
.wrap{display:flex;flex-direction:column;align-items:center;gap:12px}.cap{color:var(--faint);font-size:12px;text-align:center}.cap b{color:var(--gold)}
.ico{stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block;width:20px;height:20px}
.screen{width:390px;height:844px;background:var(--bg);border:1px solid var(--hair);border-radius:44px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 50px 110px -28px rgba(0,0,0,.85),inset 0 0 0 6px #04050799}
.sb{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-size:13px;font-weight:700;color:var(--cream)}.sb .r{display:flex;gap:6px}.sb .r svg{width:15px;height:15px;stroke:var(--cream)}
.mtop{height:54px;flex:none;display:flex;align-items:center;gap:11px;padding:0 14px;border-bottom:1px solid var(--hair);background:linear-gradient(180deg,#15181e,#121419)}
.bk{width:34px;height:34px;border-radius:10px;background:#1b1e25;border:1px solid var(--hair);display:grid;place-items:center;color:var(--mute);flex:none}
.dr{width:34px;height:34px;border-radius:10px;background:linear-gradient(160deg,var(--gold2),var(--gold));display:grid;place-items:center;color:#1a1509;font-weight:800;font-size:11px;flex:none}
.ti{flex:1;min-width:0}.t1{font-size:14px;font-weight:700;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t2{font-size:11px;color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700;background:rgba(91,141,239,.16);color:#a9c4f7}.pill .d{width:6px;height:6px;border-radius:50%;background:var(--blue)}
.scroll{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--hair);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:8px}
.pc-h{display:flex;align-items:center;justify-content:space-between}.pc-h .t{font-size:13px;font-weight:700;color:var(--cream)}.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--gold)}
.badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px}.badge.amber{background:rgba(224,162,59,.16);color:var(--amber)}.badge.green{background:rgba(87,179,104,.16);color:var(--green)}.badge.blue{background:rgba(91,141,239,.16);color:#a9c4f7}.badge.red{background:rgba(229,99,95,.16);color:var(--red)}
.chips{display:flex;gap:7px;overflow:auto}.chip{padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--mute);background:#171a20;border:1px solid var(--hair);white-space:nowrap}.chip.on{background:rgba(198,164,99,.14);border-color:rgba(198,164,99,.45);color:var(--gold2)}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--hair);font-size:12px}.lrow:first-of-type{border-top:none}.lrow .dot{width:8px;height:8px;border-radius:50%;flex:none}.lrow .lt{flex:1;color:var(--text)}.dim{color:var(--mute)}
.tabbar{height:74px;flex:none;display:flex;align-items:flex-start;padding:9px 8px 0;background:#0e1015;border-top:1px solid var(--hair)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint);font-size:9.5px;font-weight:600}.tab .ico{width:22px;height:22px}.tab.on{color:var(--gold2)}.tab .b{width:46px;height:30px;border-radius:11px;display:grid;place-items:center}.tab.on .b{background:rgba(198,164,99,.15)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g{background:linear-gradient(180deg,#16191f,#131519);border:1px solid var(--hair);border-radius:12px;padding:12px}.gl{font-size:10px;color:var(--faint);font-weight:600}.gv{font-size:19px;font-weight:800;margin-top:4px}.mtr{height:5px;border-radius:4px;background:#23262e;overflow:hidden;margin-top:7px}.mtr i{display:block;height:100%}
.pt{display:flex;gap:8px;font-size:12px;line-height:1.4;margin-bottom:5px}.synop{font-size:12px;color:var(--mute);line-height:1.55}
.run{height:46px;border-radius:13px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--goldink);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px;border:none}.run .ico{stroke:#1a1509;width:17px;height:17px}
</style></head><body><div class="wrap"><div class="cap">ScripON Doctor · <b>Command Palette ⌘K — Mobile</b></div><div class="screen"><div class="sb"><span>9:41</span><div class="r"><svg viewBox="0 0 24 24"><path d="M2 20h.01M6 20v-4M10 20v-8M14 20V8M18 20V4"/></svg><svg viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="2"/></svg></div></div>
